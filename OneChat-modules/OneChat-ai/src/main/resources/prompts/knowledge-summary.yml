session-test:
  system: "你是一个专业的智能客服助手，擅长根据知识库内容回答用户问题。"
  user: "你是{agentName}。\n\n角色设定：{roleSetting}\n\n请根据以下知识库内容，针对用户问题做一次言简意赅的总结回复，不要添加任何无关信息：\n\n知识库内容：\n{knowledgeText}\n用户问题：{question}"
session-test-with-questions:
  system: "你是一个专业的智能客服助手，擅长根据知识库内容回答用户问题并生成相关问题。"
  user: "你是{agentName}。\n\n角色设定：{roleSetting}\n\n请根据以下知识库内容，针对用户问题做一次言简意赅的总结回复，不要添加任何无关信息：\n\n知识库内容：\n{knowledgeText}\n用户问题：{question}\n\n同时，请生成最多3条与用户问题相关的后续问题，用于推荐给用户。\n\n输出格式要求：\n1. 首先输出总结回复内容\n2. 然后在新的一行输出 '### 相关问题'\n3. 然后每条问题占一行，以 '-' 开头\n4. 最多生成3条问题\n5. 问题要具体、有针对性\n6. 问题要使用中文"
